<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử Thách Toán Học Đa Dạng - Lớp 4</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 700px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
            padding: 30px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .btn-start {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }
        .btn-start:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 20px;
            font-size: 15px;
        }
        .question-type-badge {
            display: inline-block;
            background: #ebf8ff;
            color: #3182ce;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .question-box {
            font-size: 19px;
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            white-space: pre-line;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: #ebf8ff;
            border-color: #3182ce;
            color: #2b6cb0;
        }
        .tf-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .btn-true { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; font-size: 18px; padding: 15px 40px; border-radius: 12px; cursor: pointer; font-weight: bold;}
        .btn-false { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; font-size: 18px; padding: 15px 40px; border-radius: 12px; cursor: pointer; font-weight: bold;}
        .btn-true:hover { background: #c3e6cb; }
        .btn-false:hover { background: #f5c6cb; }
        .fill-container {
            margin-bottom: 20px;
        }
        .fill-input {
            padding: 12px 20px;
            font-size: 18px;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            width: 60%;
            text-align: center;
            margin-right: 10px;
        }
        .btn-submit {
            padding: 12px 25px;
            font-size: 16px;
            background: #3182ce;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit:hover { background: #2b6cb0; }
        .result-card {
            background: #f7fafc;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .score-big {
            font-size: 42px;
            font-weight: bold;
            color: #e67e22;
            margin: 10px 0;
        }
        .stats-grid {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            font-size: 15px;
            color: #4a5568;
        }
        .details-container {
            max-height: 220px;
            overflow-y: auto;
            text-align: left;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            background: #fff;
        }
        .detail-item {
            font-size: 14px;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .detail-item.correct { color: #27ae60; }
        .detail-item.incorrect { color: #c0392b; }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn-action {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-action:hover { background: #2980b9; }
        .btn-home { background: #7f8c8d; }
        .btn-home:hover { background: #6c7a89; }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen" class="screen active">
        <h1>🌟 Thử Thách Toán Học Đa Dạng</h1>
        <p class="subtitle">Trải nghiệm các dạng bài: Trắc nghiệm, Đúng/Sai, Điền khuyết và nhiều hơn thế!</p>
        <button class="btn-start" onclick="startGame()">Bắt Đầu Chơi</button>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="quiz-header">
            <span id="question-progress">Câu hỏi: 1 / 10</span>
            <span id="timer-display">⏱️ Thời gian: 0s</span>
        </div>
        <div>
            <span class="question-type-badge" id="type-badge">Dạng bài</span>
        </div>
        <div class="question-box" id="question-text">Đang tải câu hỏi...</div>
        <div id="answers-area"></div>
    </div>

    <div id="result-screen" class="screen">
        <h1>🎉 Hoàn Thành Xuất Sắc!</h1>
        <div class="result-card">
            <p>Điểm số của bạn (Thang 100):</p>
            <div class="score-big" id="final-score">100đ</div>
            <div class="stats-grid">
                <div>✅ Đúng: <strong id="correct-count">10</strong>/10</div>
                <div>⏱️ Thời gian: <strong id="total-time">0s</strong></div>
            </div>
        </div>
        <p style="text-align: left; font-weight: bold; margin-bottom: 8px; color: #2c3e50; font-size: 14px;">Chi tiết đáp án:</p>
        <div class="details-container" id="details-container"></div>
        <div class="btn-group">
            <button class="btn-action" onclick="startGame()">Chơi Lại</button>
            <button class="btn-action btn-home" onclick="goHome()">🏠 Về Trang Chủ</button>
        </div>
    </div>
</div>

<script>
    const questionBank = [
        { type: 'mc', typeName: '🎯 Chọn 1 đáp án đúng', q: "Tính giá trị biểu thức: 2450 × 4 = ?", options: ["9800", "8900", "9600", "10000"], answer: "9800" },
        { type: 'mc', typeName: '🎯 Chọn 1 đáp án đúng', q: "Thực hiện phép tính: 8400 : 4 = ?", options: ["2100", "2050", "2200", "2150"], answer: "2100" },
        { type: 'mc', typeName: '🎯 Chọn 1 đáp án đúng', q: "Tính giá trị biểu thức: (1200 + 400) × 2 = ?", options: ["3200", "2000", "2800", "3000"], answer: "3200" },
        { type: 'mc', typeName: '🎯 Chọn 1 đáp án đúng', q: "Tìm x, biết: x + 1500 = 4500", options: ["3000", "6000", "2500", "3500"], answer: "3000" },
        { type: 'mc', typeName: '🎯 Chọn 1 đáp án đúng', q: "Đổi đơn vị: 5 m 3 cm = ... cm", options: ["503 cm", "530 cm", "53 cm", "5003 cm"], answer: "503 cm" },
        { type: 'mc', typeName: '🎯 Chọn 1 đáp án đúng', q: "Góc có số đo lớn hơn góc vuông và nhỏ hơn góc bẹt là góc gì?", options: ["Góc tù", "Góc nhọn", "Góc bẹt", "Góc vuông"], answer: "Góc tù" },
        { type: 'mc', typeName: '🎯 Chọn 1 đáp án đúng', q: "Một hình vuông có cạnh 9 cm. Tính diện tích?", options: ["81 cm²", "36 cm²", "18 cm²", "72 cm²"], answer: "81 cm²" },
        { type: 'mc', typeName: '🎯 Chọn 1 đáp án đúng', q: "Trung bình cộng của hai số 45 và 65 là bao nhiêu?", options: ["55", "50", "60", "110"], answer: "55" },

        { type: 'tf', typeName: '✔️❌ Đúng hay Sai', q: "Phát biểu sau Đúng hay Sai?\nGóc vuông có số đo bằng 90 độ.", options: ["Đúng", "Sai"], answer: "Đúng" },
        { type: 'tf', typeName: '✔️❌ Đúng hay Sai', q: "Phát biểu sau Đúng hay Sai?\nKết quả của phép tính 125 × 8 bằng 1000.", options: ["Đúng", "Sai"], answer: "Đúng" },
        { type: 'tf', typeName: '✔️❌ Đúng hay Sai', q: "Phát biểu sau Đúng hay Sai?\nSố dư lớn nhất trong phép chia cho 5 là 5.", options: ["Đúng", "Sai"], answer: "Sai" },
        { type: 'tf', typeName: '✔️❌ Đúng hay Sai', q: "Phát biểu sau Đúng hay Sai?\n3 tấn 50 kg = 3050 kg.", options: ["Đúng", "Sai"], answer: "Đúng" },

        { type: 'fill', typeName: '✍️ Điền vào chỗ trống', q: "Điền số thích hợp vào chỗ chấm:\n6 km = ... m\n(Chỉ nhập số)", options: [], answer: "6000" },
        { type: 'fill', typeName: '✍️ Điền vào chỗ trống', q: "Tìm x, biết: x × 3 = 6300. Giá trị của x là:\n(Chỉ nhập số)", options: [], answer: "2100" },
        { type: 'fill', typeName: '✍️ Điền vào chỗ trống', q: "Điền số thích hợp:\n2 giờ 15 phút = ... phút\n(Chỉ nhập số)", options: [], answer: "135" },
        { type: 'fill', typeName: '✍️ Điền vào chỗ trống', q: "Số liền sau của số 9999 là:\n(Chỉ nhập số)", options: [], answer: "10000" }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let correctCount = 0;
    let startTime = 0;
    let timerInterval = null;
    let elapsedTime = 0;
    let userAnswersLog = [];

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function startGame() {
        currentQuestions = shuffleArray(questionBank).slice(0, 10);
        currentIndex = 0;
        correctCount = 0;
        score = 0;
        elapsedTime = 0;
        userAnswersLog = [];

        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');

        startTime = Date.now();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('timer-display').innerText = `⏱️ Thời gian: ${elapsedTime}s`;
        }, 1000);

        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            endGame();
            return;
        }

        let qData = currentQuestions[currentIndex];
        document.getElementById('question-progress').innerText = `Câu hỏi: ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('type-badge').innerText = qData.typeName;
        document.getElementById('question-text').innerText = qData.q;

        let area = document.getElementById('answers-area');
        area.innerHTML = '';

        if (qData.type === 'mc') {
            let grid = document.createElement('div');
            grid.className = 'options-grid';
            let shuffledOpts = shuffleArray(qData.options);
            shuffledOpts.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => submitAnswer(opt, qData.answer, qData.q);
                grid.appendChild(btn);
            });
            area.appendChild(grid);
        } else if (qData.type === 'tf') {
            let tfDiv = document.createElement('div');
            tfDiv.className = 'tf-container';
            
            let btnTrue = document.createElement('button');
            btnTrue.className = 'btn-true';
            btnTrue.innerText = '✅ Đúng';
            btnTrue.onclick = () => submitAnswer('Đúng', qData.answer, qData.q);

            let btnFalse = document.createElement('button');
            btnFalse.className = 'btn-false';
            btnFalse.innerText = '❌ Sai';
            btnFalse.onclick = () => submitAnswer('Sai', qData.answer, qData.q);

            tfDiv.appendChild(btnTrue);
            tfDiv.appendChild(btnFalse);
            area.appendChild(tfDiv);
        } else if (qData.type === 'fill') {
            let fillDiv = document.createElement('div');
            fillDiv.className = 'fill-container';

            let input = document.createElement('input');
            input.type = 'text';
            input.className = 'fill-input';
            input.id = 'fill-answer-input';
            input.placeholder = 'Nhập câu trả lời...';

            let btnSub = document.createElement('button');
            btnSub.className = 'btn-submit';
            btnSub.innerText = 'Trả Lời ➔';
            btnSub.onclick = () => {
                let val = document.getElementById('fill-answer-input').value.trim();
                if (val === '') {
                    alert('Vui lòng nhập câu trả lời!');
                    return;
                }
                submitAnswer(val, qData.answer, qData.q);
            };

            input.onkeypress = (e) => {
                if (e.key === 'Enter') btnSub.click();
            };

            fillDiv.appendChild(input);
            fillDiv.appendChild(btnSub);
            area.appendChild(fillDiv);
            setTimeout(() => input.focus(), 100);
        }
    }

    function submitAnswer(selected, correct, questionText) {
        let isCorrect = (selected.toString().trim().toLowerCase() === correct.toString().trim().toLowerCase());
        if (isCorrect) correctCount++;

        userAnswersLog.push({
            question: questionText,
            selected: selected,
            correct: correct,
            isCorrect: isCorrect
        });

        currentIndex++;
        loadQuestion();
    }

    function endGame() {
        clearInterval(timerInterval);
        score = correctCount * (100 / currentQuestions.length);

        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');

        document.getElementById('final-score').innerText = `${Math.round(score)}đ`;
        document.getElementById('correct-count').innerText = `${correctCount}/${currentQuestions.length}`;
        document.getElementById('total-time').innerText = `${elapsedTime}s`;

        let detailsContainer = document.getElementById('details-container');
        detailsContainer.innerHTML = '';

        userAnswersLog.forEach((item, index) => {
            let div = document.createElement('div');
            div.className = `detail-item ${item.isCorrect ? 'correct' : 'incorrect'}`;
            div.innerHTML = `<strong>C${index + 1}:</strong> ${item.question.replace(/\n/g, ' ')}<br>` +
                            `👉 Bạn chọn: <b>${item.selected}</b> | ` +
                            (item.isCorrect ? `✅ Đúng` : `❌ Đáp án đúng: <b>${item.correct}</b>`);
            detailsContainer.appendChild(div);
        });
    }

    function goHome() {
        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('start-screen').classList.add('active');
    }
</script>

</body>
</html>
