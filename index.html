<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Game Vui Học - Lớp 4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Be Vietnam Pro', sans-serif; }
        body {
            background: linear-gradient(135deg,#eef2ff,#fdf2f8,#fff7ed);
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

<!-- HEADER -->
<header class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-5 py-7 flex flex-wrap justify-between items-center gap-4">
        <div>
            <h1 class="text-2xl md:text-3xl font-black">🎮 KHO GAME VUI HỌC - LỚP 4</h1>
            <p class="text-indigo-100 mt-1 text-sm">Học mà chơi, chơi mà học cùng Thầy Tuấn Anh</p>
        </div>
        <a href="admin.html" class="bg-white/10 hover:bg-white/25 text-white font-bold px-4 py-2.5 rounded-2xl border border-white/30 transition text-sm">
            ⚙️ Quản trị game
        </a>
    </div>
</header>

<main class="max-w-6xl mx-auto px-5 py-8 flex-grow w-full">
    <!-- SEARCH & FILTER -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
        <div id="subjectFilters" class="flex flex-wrap gap-2"></div>
        <input id="searchInput" type="text" placeholder="🔍 Tìm tên trò chơi..." oninput="renderHomeGames()"
            class="w-full md:w-72 bg-white border-2 border-indigo-100 rounded-2xl px-4 py-2.5 outline-none focus:border-indigo-500 text-sm">
    </div>

    <!-- GAME LIST -->
    <div class="mb-4">
        <h2 id="totalCountText" class="font-black text-indigo-700 text-lg">📚 Thư viện trò chơi</h2>
    </div>

    <div id="homeGameList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</main>

<!-- MODAL PLAY GAME -->
<div id="gameModal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-5xl rounded-3xl overflow-hidden shadow-2xl flex flex-col h-[90vh]">
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-4 text-white flex justify-between items-center">
            <h3 id="modalTitle" class="font-black text-lg">Chơi trò chơi</h3>
            <button onclick="closeModal()" class="bg-white/20 hover:bg-white/30 text-white font-bold px-4 py-1.5 rounded-xl">✕ Đóng</button>
        </div>
        <div id="modalBody" class="p-0 flex-grow bg-slate-900 flex items-center justify-center relative"></div>
    </div>
</div>

<footer class="bg-indigo-950 text-white text-center py-6 mt-12">
    <p class="font-bold">💖 KHO GAME VUI HỌC - LỚP 4 💖</p>
    <p class="text-indigo-200 text-xs mt-1">Giáo viên: Thầy Tuấn Anh</p>
</footer>

<script>
const STORAGE_KEY = 'khoGameVuiHocLop4';
let currentSubject = 'Tất cả';

function getGames() {
    try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(data) ? data : [];
    } catch {
        return [];
    }
}

const subjects = ['Tất cả', 'Toán', 'Tiếng Việt', 'Khoa học', 'Lịch sử và Địa lí', 'Tin học', 'Tiếng Anh', 'Đạo đức', 'Hoạt động trải nghiệm', 'Âm nhạc', 'Mĩ thuật', 'Giáo dục thể chất', 'Khác'];

function renderFilters() {
    const container = document.getElementById('subjectFilters');
    container.innerHTML = '';
    subjects.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = `subject-btn font-bold px-4 py-2 rounded-xl text-sm transition ${currentSubject === sub ? 'bg-indigo-600 text-white shadow' : 'bg-white text-indigo-700 hover:bg-indigo-50 border border-indigo-100'}`;
        btn.textContent = sub;
        btn.onclick = () => { currentSubject = sub; renderFilters(); renderHomeGames(); };
        container.appendChild(btn);
    });
}

function renderHomeGames() {
    const container = document.getElementById('homeGameList');
    const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
    let games = getGames();

    if (currentSubject !== 'Tất cả') {
        games = games.filter(g => g.subject === currentSubject);
    }
    if (keyword) {
        games = games.filter(g => g.name.toLowerCase().includes(keyword));
    }

    document.getElementById('totalCountText').textContent = `📚 Thư viện trò chơi (${games.length} trò chơi)`;

    if (games.length === 0) {
        container.innerHTML = `
            <div class="col-span-full text-center py-12 bg-white rounded-3xl shadow-sm border border-indigo-100">
                <div class="text-6xl mb-3">🔍</div>
                <p class="font-bold text-indigo-700 text-lg">Không tìm thấy trò chơi nào phù hợp.</p>
            </div>
        `;
        return;
    }

    container.replaceChildren();

    games.forEach(game => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-3xl p-6 shadow-md border border-indigo-100 flex flex-col justify-between hover:shadow-xl transition';

        const isOffline = game.type === 'offline' || !game.embed;
        const badgeColor = isOffline ? 'bg-emerald-100 text-emerald-800' : 'bg-indigo-100 text-indigo-800';
        const badgeText = isOffline ? '💻 Tệp Offline' : '🌐 Trực tuyến';

        const content = document.createElement('div');
        content.innerHTML = `
            <span class="inline-block ${badgeColor} text-xs font-black px-3 py-1 rounded-full mb-3">${badgeText}</span>
            <h3 class="font-black text-xl text-indigo-900 mb-2">${game.name}</h3>
            <p class="text-sm text-slate-500 mb-4">📚 Môn: ${game.subject}</p>
        `;

        const actionBtn = document.createElement('button');
        actionBtn.className = 'w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-black py-3 rounded-2xl shadow transition text-center block';
        actionBtn.textContent = '▶ CHƠI NGAY';

        actionBtn.onclick = () => openGameModal(game);

        card.appendChild(content);
        card.appendChild(actionBtn);
        container.appendChild(card);
    });
}

function openGameModal(game) {
    document.getElementById('modalTitle').textContent = game.name;
    const modalBody = document.getElementById('modalBody');
    modalBody.innerHTML = '';

    const isOffline = game.type === 'offline' || !game.embed;

    if (isOffline && game.fileContent) {
        // Tạo một iframe dạng srcdoc để hiển thị trực tiếp nội dung file HTML offline an toàn tuyệt đối
        const iframe = document.createElement('iframe');
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.style.background = 'white';
        iframe.srcdoc = game.fileContent;
        modalBody.appendChild(iframe);
    } else {
        // Game trực tuyến (Wordwall, Quizizz...)
        modalBody.innerHTML = game.embed || '';
        const iframe = modalBody.querySelector('iframe');
        if (iframe) {
            iframe.setAttribute('width', '100%');
            iframe.setAttribute('height', '100%');
            iframe.style.width = '100%';
            iframe.style.height = '100%';
        }
    }

    document.getElementById('gameModal').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('gameModal').classList.add('hidden');
    document.getElementById('modalBody').innerHTML = '';
}

renderFilters();
renderHomeGames();
</script>
</body>
</html>
